<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Egypt Partner Blitz 2026 — Results Summary</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:   #FFC300;
    --teal:   #009EA7;
    --teal2:  #00C8D4;
    --night:  #070B1A;
    --night2: #0D1428;
    --white:  #FFFFFF;
    --muted:  rgba(255,255,255,0.55);
    --green:  #22c55e;
    --amber:  #f59e0b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Sora','DM Sans',sans-serif; background:var(--night); color:var(--white); min-height:100vh; }
  .partner-table td, .ncrm-table td, .ae-name, .industry-name, .header-date,
  .stat-card .lbl, .ae-count, .pct-label { font-family:'DM Sans',sans-serif; }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, #06091A 0%, #0B1535 40%, #0F1E4A 60%, #08102A 100%);
    border-bottom: 1px solid rgba(255,195,0,0.15);
    padding: 28px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content:'';
    position:absolute;bottom:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(0,200,212,0.3),rgba(255,195,0,0.2),transparent);
  }
  .header-left { display:flex; align-items:center; gap:18px; }
  .header-logo { height:38px; }
  .header-divider { width:1px; height:36px; background:rgba(255,255,255,0.12); }
  .header-title { font-size:1.15rem; font-weight:700; letter-spacing:-0.01em; }
  .header-title span { color:var(--gold); }
  .header-badge {
    background: rgba(0,200,212,0.1);
    border: 1px solid rgba(0,200,212,0.25);
    color: var(--teal2);
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:6px 16px;
    border-radius:50px;
  }
  .header-date { color:var(--muted); font-size:0.8rem; font-family:'DM Sans',sans-serif; }

  /* ── MAIN ── */
  .main { max-width:1200px; margin:0 auto; padding:40px 24px 80px; }

  /* ── SECTION TAG (chip style matching index.html) ── */
  .section-label {
    display:inline-block;
    font-size:0.7rem;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--teal2);
    background:rgba(0,200,212,0.1);
    border:1px solid rgba(0,200,212,0.22);
    padding:4px 14px;
    border-radius:20px;
    margin-bottom:12px;
  }
  .section-heading {
    font-size:1.4rem;
    font-weight:800;
    margin-bottom:28px;
    letter-spacing:-0.02em;
  }

  /* ── HERO STATS ── */
  .hero-stats {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
    gap:16px;
    margin-bottom:52px;
  }
  .stat-card {
    background: linear-gradient(135deg, #0D1428, #111827);
    border:1px solid rgba(255,195,0,0.12);
    border-radius:20px;
    padding:28px 20px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .stat-card::before {
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,rgba(255,195,0,0.35),transparent);
  }
  .stat-card .num {
    font-size:3rem;
    font-weight:900;
    line-height:1;
    background:linear-gradient(135deg,#FFC300,#FFD700);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .stat-card .num.green {
    background:linear-gradient(135deg,#22c55e,#4ade80);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .stat-card .num.teal  {
    background:linear-gradient(135deg,#00C8D4,#00e5f0);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .stat-card .lbl {
    font-size:0.75rem;
    color:var(--muted);
    margin-top:8px;
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:.06em;
  }

  /* ── CARD ── */
  .card {
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:20px;
    padding:28px;
    margin-bottom:28px;
  }
  .card-title {
    font-size:1rem;
    font-weight:700;
    margin-bottom:22px;
    display:flex;
    align-items:center;
    gap:8px;
    letter-spacing:-0.01em;
  }
  .card-title .icon { font-size:1.1rem; }

  /* ── PARTNER TABLE ── */
  .partner-table { width:100%; border-collapse:separate; border-spacing:0 8px; font-size:0.85rem; }
  .partner-table th {
    background:transparent;
    color:rgba(255,255,255,0.45);
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:.1em;
    padding:4px 16px 8px;
    text-align:left;
    font-weight:700;
  }
  .partner-table tbody tr {
    background: rgba(255,255,255,0.04);
    border-radius:14px;
    transition:all 0.2s;
  }
  .partner-table tbody tr:hover { background:rgba(255,255,255,0.07); transform:translateX(3px); }
  .partner-table td {
    padding:16px;
    vertical-align:middle;
  }
  .partner-table tbody tr td:first-child { border-radius:14px 0 0 14px; }
  .partner-table tbody tr td:last-child  { border-radius:0 14px 14px 0; }
  .partner-table.rank-1-row { background:rgba(255,195,0,0.08); border:1px solid rgba(255,195,0,0.2); }
  .rank-pill {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    border-radius:50%;
    font-weight:900;
    font-size:0.8rem;
  }
  .r1 { background:linear-gradient(135deg,#FFD700,#FFA500); color:#5A3A00; }
  .r2 { background:linear-gradient(135deg,#E8E8E8,#B0B0B0); color:#3A3A3A; }
  .r3 { background:linear-gradient(135deg,#CD7F32,#A05020); color:#fff; }
  .rn { background:rgba(255,255,255,0.08); color:var(--muted); }
  .pct-bar-wrap { display:flex; align-items:center; gap:10px; }
  .pct-bar-track { flex:1; height:8px; background:rgba(255,255,255,0.08); border-radius:99px; overflow:hidden; min-width:80px; }
  .pct-bar-fill  { height:8px; border-radius:99px; }
  .pct-label { font-size:0.8rem; font-weight:700; width:48px; text-align:right; flex-shrink:0; }

  /* ── AE BARS ── */
  .ae-list { display:flex; flex-direction:column; gap:10px; }
  .ae-row {
    display:flex; align-items:center; gap:12px;
    background:rgba(255,255,255,0.04);
    border-radius:14px;
    padding:14px 16px;
    transition:all 0.2s;
  }
  .ae-row:hover { background:rgba(255,255,255,0.07); transform:translateX(4px); }
  .ae-name { color:#fff; font-size:0.85rem; font-weight:600; width:150px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ae-track { flex:1; height:8px; background:rgba(255,255,255,0.07); border-radius:99px; overflow:hidden; }
  .ae-fill  { height:8px; background:linear-gradient(90deg,var(--teal),var(--teal2)); border-radius:99px; transition:width 0.6s ease; }
  .ae-fill.non-crm { background:linear-gradient(90deg,#7c3aed,#a78bfa); }
  .ae-count { color:var(--gold); font-weight:800; font-size:0.88rem; width:28px; text-align:right; flex-shrink:0; }

  /* ── INDUSTRY GRID ── */
  .industry-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .industry-card {
    background: linear-gradient(135deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:18px;
    display:flex;
    align-items:center;
    gap:12px;
    transition:all 0.2s;
  }
  .industry-card:hover { background:rgba(255,255,255,0.06); transform:translateY(-2px); }
  .industry-icon { font-size:1.5rem; flex-shrink:0; }
  .industry-name { font-size:0.82rem; font-weight:600; color:rgba(255,255,255,0.85); }
  .industry-count { font-size:1.4rem; font-weight:900; color:var(--gold); line-height:1; }

  /* ── NON-CRM TABLE ── */
  .ncrm-table { width:100%; border-collapse:separate; border-spacing:0 6px; font-size:0.82rem; }
  .ncrm-table th {
    background:transparent;
    color:rgba(255,255,255,0.45);
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:.1em;
    padding:4px 14px 6px;
    text-align:left;
    font-weight:700;
  }
  .ncrm-table tbody tr {
    background: rgba(255,255,255,0.03);
    border-radius:12px;
  }
  .ncrm-table tbody tr:hover { background:rgba(255,255,255,0.06); }
  .ncrm-table td {
    padding:11px 14px;
    vertical-align:middle;
  }
  .ncrm-table tbody tr td:first-child { border-radius:12px 0 0 12px; }
  .ncrm-table tbody tr td:last-child  { border-radius:0 12px 12px 0; }
  .partner-tag {
    display:inline-block;
    background:rgba(0,158,167,0.15);
    border:1px solid rgba(0,158,167,0.25);
    color:var(--teal2);
    font-size:0.72rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:99px;
  }
  .industry-tag {
    display:inline-block;
    background:rgba(255,195,0,0.1);
    border:1px solid rgba(255,195,0,0.2);
    color:var(--gold);
    font-size:0.72rem;
    font-weight:600;
    padding:3px 9px;
    border-radius:99px;
  }

  /* ── FOOTER ── */
  .footer {
    text-align:center;
    padding:40px 32px;
    color:rgba(255,255,255,0.2);
    font-size:0.75rem;
    border-top:1px solid rgba(255,255,255,0.05);
    margin-top:40px;
    background:linear-gradient(135deg,#06091A,#0D1428);
    letter-spacing:.04em;
  }

  /* ── TABS ── */
  .tabs {
    display:flex;
    gap:8px;
    margin-bottom:36px;
    flex-wrap:wrap;
  }
  .tab-btn {
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    color:var(--muted);
    font-family:'Sora','DM Sans',sans-serif;
    font-size:0.85rem;
    font-weight:600;
    padding:10px 24px;
    border-radius:50px;
    cursor:pointer;
    transition:all 0.2s;
    letter-spacing:0.02em;
  }
  .tab-btn:hover { color:#fff; background:rgba(255,255,255,0.09); border-color:rgba(255,255,255,0.2); }
  .tab-btn.active {
    background:rgba(0,200,212,0.15);
    border-color:rgba(0,200,212,0.35);
    color:var(--teal2);
  }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* ── AE PROFILE CARD ── */
  .ae-profile {
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:20px;
    padding:20px 22px;
    background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
  }
  .ae-avatar {
    width:48px;height:48px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:0.9rem;font-weight:900;flex-shrink:0;
  }
  .ae-profile-name { font-size:1.05rem; font-weight:800; letter-spacing:-0.01em; }
  .ae-profile-meta { font-size:0.78rem; color:var(--muted); margin-top:3px; font-family:'DM Sans',sans-serif; }
  .ae-section-label {
    font-size:0.7rem;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);
    margin:24px 0 12px;
  }
  .badge-crm {
    display:inline-block;background:rgba(0,200,212,0.12);border:1px solid rgba(0,200,212,0.25);
    color:var(--teal2);font-size:0.68rem;font-weight:700;padding:2px 8px;border-radius:99px;
    text-transform:uppercase;letter-spacing:.05em;
  }
  .badge-ncrm {
    display:inline-block;background:rgba(167,139,250,0.12);border:1px solid rgba(167,139,250,0.25);
    color:#a78bfa;font-size:0.68rem;font-weight:700;padding:2px 8px;border-radius:99px;
    text-transform:uppercase;letter-spacing:.05em;
  }
  .badge-salma {
    display:inline-block;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.25);
    color:#f59e0b;font-size:0.68rem;font-weight:700;padding:2px 8px;border-radius:99px;
    text-transform:uppercase;letter-spacing:.05em;
  }

  /* ── LOADING ── */
  .loading { text-align:center; padding:80px 20px; color:var(--muted); font-size:0.9rem; }
  .loading-spinner { display:inline-block; width:32px; height:32px; border:3px solid rgba(255,255,255,0.1); border-top-color:var(--teal); border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <img src="https://myrnagamal1.github.io/Egypt_BlitzDay/sap-logo.png" class="header-logo" onerror="this.style.display='none'">
    <div class="header-divider"></div>
    <div>
      <div class="header-title">Egypt Partner Blitz <span>2026</span></div>
      <div class="header-date">Results Summary · October 5, 2026</div>
    </div>
  </div>
  <div class="header-badge">Final Results</div>
</div>

<!-- MAIN -->
<div class="main" id="main-content">
  <div class="loading">
    <div class="loading-spinner"></div><br>Loading results…
  </div>
</div>

<div class="footer" id="footer" style="display:none">
  SAP Egypt · Egypt Partner Blitz 2026 · Internal Use Only
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbz5y7Ht3FAJiHjUKI4BY8L1tXAIrVXIuMkVm8Ua3cTNYtchc2we4Kjcrx5pPVBuy6o3RQ/exec';

const TARGETS = { 'B-Connect':10,'ITE':10,'Spirit':5,'Solex':10,'Jupiter':5,'DBS':10,'Apps-TCH':15,'Appstech':15 };
const TOTAL_TARGET = Object.values(TARGETS).reduce((a,b)=>a+b,0);

const INDUSTRY_ICONS = {
  'Manufacturing':            '🏭',
  'Healthcare / Pharma':      '🏥',
  'Construction / Real Estate':'🏗️',
  'Retail / FMCG':            '🛒',
  'Banking / Finance':        '🏦',
  'Government / Public Sector':'🏛️',
  'High-Tech':                '💻',
  'Professional Services':    '💼',
  'Agribusiness':             '🌱',
  'Chemicals':                '⚗️',
  'Aerospace & Defense':      '🚀',
  'Engineering, Construction & Operations':'⚙️',
  'Other':                    '📋',
};

// Normalize AE names (merge duplicates)
function normalizeAE(ae) {
  if (!ae || ae.trim() === '' || ae.trim().toUpperCase() === 'NON-CRM') return 'NON-CRM';
  const s = ae.trim().toLowerCase();
  if (s.includes('noura') || s.includes('ghoneim'))    return 'Noura Ghoneim';
  if (s.includes('ismail') || s.includes('hamed'))     return 'Ismail Hamed';
  if (s.includes('nouran') || s.includes('khaled') && s.includes('n')) return 'Nouran Khaled';
  if (s.includes('salma') || s.includes('youssef') && s.includes('s'))  return 'Salma Youssef';
  if (s.includes('kholoud'))                           return 'Kholoud Khaled';
  if (s.includes('nabil') || s.includes('medhat'))     return 'Nabil Medhat';
  if (s.includes('tarek') && s.includes('daly'))       return 'Tarek El Daly';
  if (s.includes('tarek') && s.includes('sisi'))       return 'Tarek Elsisi';
  if (s.includes('ahmed') || s.includes('youssef') && s.includes('a'))  return 'Ahmed Youssef';
  return ae.trim();
}

// Normalize partner name
function normalizePartner(p) {
  if (!p) return p;
  if (p.trim() === 'Appstech') return 'Apps-TCH';
  return p.trim();
}

fetch(API)
  .then(r => r.json())
  .then(data => {
    const allRows = data.rows || [];
    const active  = allRows.filter(r => (r['Excluded']||'').trim().toUpperCase() !== 'YES');

    // ── Aggregate ──
    const aeCounts      = {};
    const industryCounts= {};
    const partnerCounts = {};
    const nonCRM        = [];
    const allAERows     = {}; // CRM rows keyed by normalized AE
    const nextStepCounts= {};
    const solutionCounts= {};

    active.forEach(r => {
      const ae      = normalizeAE(r['AE']);
      const partner = normalizePartner(r['Partner Name'] || '');
      const industry= (r['Industry'] || 'Other').trim();
      const account = (r['Account Name'] || '').trim();
      const contact = (r['Customer Name'] || '').trim();
      const nextstep= (r['Agreed Next step'] || '').trim();
      const solution= (r['Solution needed'] || '').trim();

      aeCounts[ae]       = (aeCounts[ae]       || 0) + 1;
      industryCounts[industry] = (industryCounts[industry] || 0) + 1;
      partnerCounts[partner]   = (partnerCounts[partner]   || 0) + 1;
      if (nextstep) nextStepCounts[nextstep] = (nextStepCounts[nextstep]||0)+1;
      if (solution) solutionCounts[solution] = (solutionCounts[solution]||0)+1;

      // Collect CRM rows per AE (Salma rolls into Ismail)
      if (ae !== 'NON-CRM') {
        const rowAE = ae === 'Salma Youssef' ? 'Ismail Hamed' : ae;
        if (!allAERows[rowAE]) allAERows[rowAE] = [];
        allAERows[rowAE].push({ partner, account, industry, contact, nextstep, badge: ae === 'Salma Youssef' ? 'salma' : 'crm' });
      }

      if (ae === 'NON-CRM') {
        const NOURA_ACCOUNTS = ['al-shaheen','hg group','gama construction'];
        const acctKey = account.toLowerCase();
        let ncrm_ae = 'Ismail Hamed';
        if (NOURA_ACCOUNTS.some(k => acctKey.includes(k))) ncrm_ae = 'Noura Ghoneim';
        nonCRM.push({ partner, account, industry, contact, nextstep, ncrm_ae });
      }
    });

    const totalLeads   = active.length;
    const totalPartners= Object.keys(partnerCounts).length;
    const targetPct    = Math.round((totalLeads / TOTAL_TARGET) * 100);

    // ── Partner rankings by % of target ──
    const partnerRanked = Object.entries(partnerCounts).map(([p, leads]) => {
      const target = TARGETS[p] || 10;
      const pct    = Math.round((leads / target) * 100);
      return { partner: p, leads, target, pct };
    }).sort((a,b) => b.pct - a.pct || b.leads - a.leads);

    // ── AE sorted ──
    const aeSorted = Object.entries(aeCounts).sort((a,b) => b[1] - a[1]);
    const maxAE    = aeSorted[0]?.[1] || 1;

    // ── Render ──
    const AE_COLORS = {
      'Noura Ghoneim':  '#00C8D4',
      'Ismail Hamed':   '#a78bfa',
      'Nouran Khaled':  '#f59e0b',
      'Kholoud Khaled': '#22c55e',
      'Nabil Medhat':   '#f87171',
      'Tarek El Daly':  '#60a5fa',
      'Tarek Elsisi':   '#fb923c',
      'Ahmed Youssef':  '#e879f9',
    };

    function renderAETab(ae, color) {
      const crm   = allAERows[ae] || [];
      const ncrm  = nonCRM.filter(r => r.ncrm_ae === ae);
      const initials = ae.split(' ').map(w=>w[0]).join('');
      const crmCount  = crm.filter(r=>r.badge==='crm').length;
      const salmaCount= crm.filter(r=>r.badge==='salma').length;
      const ncrmCount = ncrm.length;
      const total = crm.length + ncrmCount;

      const combinedRows = [
        ...crm.map(r => ({...r, source:'crm'})),
        ...ncrm.map(r => ({...r, source:'ncrm'}))
      ];

      if (!combinedRows.length) return `<div style="color:var(--muted);font-size:0.85rem;padding:16px 0;">No accounts recorded.</div>`;

      const tableRows = combinedRows.map((r,i) => {
        const badge = r.source === 'ncrm'
          ? `<span class="badge-ncrm">Non-CRM</span>`
          : r.badge === 'salma'
            ? `<span class="badge-salma">via Salma</span>`
            : `<span class="badge-crm">CRM</span>`;
        return `<tr>
          <td style="color:var(--muted);font-size:0.75rem;">${i+1}</td>
          <td style="font-weight:700;">${r.account||'—'}</td>
          <td>${badge}</td>
          <td><span class="partner-tag">${r.partner||'—'}</span></td>
          <td><span class="industry-tag">${r.industry||'Other'}</span></td>
          <td style="color:rgba(255,255,255,0.7);">${r.contact||'—'}</td>
          <td style="color:rgba(255,255,255,0.6);font-size:0.78rem;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${r.nextstep}">${r.nextstep||'—'}</td>
        </tr>`;
      }).join('');

      const metaParts = [`${crmCount} CRM`];
      if (salmaCount) metaParts.push(`${salmaCount} via Salma`);
      if (ncrmCount)  metaParts.push(`${ncrmCount} Non-CRM`);

      return `
        <div class="ae-profile">
          <div class="ae-avatar" style="background:${color}22;border:1.5px solid ${color}44;color:${color};">${initials}</div>
          <div>
            <div class="ae-profile-name">${ae}${ae==='Ismail Hamed'?'<span style="color:var(--muted);font-size:0.75rem;font-weight:400;margin-left:8px;">incl. Salma Youssef</span>':''}</div>
            <div class="ae-profile-meta">${total} total account${total!==1?'s':''} · ${metaParts.join(' · ')}</div>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table class="ncrm-table" style="font-size:0.82rem;">
            <thead><tr><th>#</th><th>Account</th><th>Type</th><th>Partner</th><th>Industry</th><th>Contact</th><th>Next Step</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>`;
    }

    // ── Dashboard helpers ──
    const CHART_COLORS = ['#00C8D4','#FFC300','#22c55e','#a78bfa','#f59e0b','#f87171','#60a5fa','#fb923c','#e879f9','#34d399'];

    function svgDonut(slices, cx, cy, r) {
      let total = slices.reduce((s,x)=>s+x.v,0); if(!total) return '';
      let angle = -Math.PI/2, paths = '';
      slices.forEach((s)=>{
        const sweep = (s.v/total)*2*Math.PI;
        const x1=cx+r*Math.cos(angle), y1=cy+r*Math.sin(angle);
        angle+=sweep;
        const x2=cx+r*Math.cos(angle), y2=cy+r*Math.sin(angle);
        const large=sweep>Math.PI?1:0;
        paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${s.c}" opacity="0.85"/>`;
      });
      return `<svg viewBox="0 0 ${cx*2} ${cy*2}" style="width:100%;max-width:180px;">
        ${paths}
        <circle cx="${cx}" cy="${cy}" r="${r*0.55}" fill="#0D1428"/>
        <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="18" font-weight="900" font-family="Sora">${total}</text>
        <text x="${cx}" y="${cy+18}" text-anchor="middle" dominant-baseline="middle" fill="rgba(255,255,255,0.4)" font-size="9" font-family="DM Sans">TOTAL</text>
      </svg>`;
    }

    function hBar(label, value, max, color) {
      const w = Math.round((value/max)*100);
      return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div style="width:130px;font-size:0.8rem;font-family:'DM Sans',sans-serif;color:rgba(255,255,255,0.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;">${label}</div>
        <div style="flex:1;height:8px;background:rgba(255,255,255,0.07);border-radius:99px;overflow:hidden;">
          <div style="height:8px;width:${w}%;background:${color};border-radius:99px;"></div>
        </div>
        <div style="width:28px;text-align:right;font-size:0.8rem;font-weight:700;color:${color};flex-shrink:0;">${value}</div>
      </div>`;
    }

    const industrySorted  = Object.entries(industryCounts).sort((a,b)=>b[1]-a[1]);
    const nextStepSorted  = Object.entries(nextStepCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const partnerSorted   = Object.entries(partnerCounts).sort((a,b)=>b[1]-a[1]);
    const maxPartner      = partnerSorted[0]?.[1]||1;
    const maxNextStep     = nextStepSorted[0]?.[1]||1;
    const industrySlices  = industrySorted.slice(0,8).map(([k,v],i)=>({v,c:CHART_COLORS[i%CHART_COLORS.length],k}));

    // AE leaderboard for dashboard (Salma merged into Ismail)
    const aeDisplay = Object.entries(aeCounts)
      .filter(([ae])=>ae!=='NON-CRM'&&ae!=='Salma Youssef')
      .map(([ae,count])=>{
        const extra = ae==='Ismail Hamed'?(aeCounts['Salma Youssef']||0):0;
        return [ae, count+extra];
      })
      .sort((a,b)=>b[1]-a[1]);
    const maxAEDisplay = aeDisplay[0]?.[1]||1;

    document.getElementById('main-content').innerHTML = `

      <!-- TABS -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('overview',this)">Overview</button>
        <button class="tab-btn" onclick="switchTab('dashboard',this)">Dashboard</button>
        <button class="tab-btn" onclick="switchTab('ae-summary',this)">AE Accounts</button>
      </div>

      <!-- TAB: OVERVIEW -->
      <div id="tab-overview" class="tab-panel active">

        <!-- HERO STATS -->
        <div class="hero-stats" style="margin-bottom:48px;margin-top:8px;">
          <div class="stat-card">
            <div class="num">${totalLeads}</div>
            <div class="lbl">Total Leads Submitted</div>
          </div>
          <div class="stat-card">
            <div class="num">${totalPartners}</div>
            <div class="lbl">Partners Participated</div>
          </div>
          <div class="stat-card">
            <div class="num" style="background:linear-gradient(135deg,#a78bfa,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">2</div>
            <div class="lbl">Days</div>
          </div>
        </div>

        <!-- PARTNER PERFORMANCE -->
        <div class="card">
          <div class="card-title"><span class="icon">🏆</span> Partner Performance — Ranked by Target %</div>
          <table class="partner-table">
            <thead>
              <tr>
                <th style="width:44px;">Rank</th>
                <th>Partner</th>
                <th>Leads</th>
                <th>Target</th>
                <th style="min-width:200px;">Achievement</th>
              </tr>
            </thead>
            <tbody>
              ${partnerRanked.map((p, i) => {
                const rankClass = i===0?'r1':i===1?'r2':i===2?'r3':'rn';
                const rankLabel = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}`;
                const barColor  = p.pct>=100?'#22c55e':p.pct>=60?'#f59e0b':'#00C8D4';
                const barWidth  = Math.min(p.pct, 100);
                const pctColor  = p.pct>=100?'#22c55e':p.pct>=60?'#f59e0b':'rgba(255,255,255,0.6)';
                return `<tr>
                  <td><span class="rank-pill ${rankClass}">${rankLabel}</span></td>
                  <td style="font-weight:700;">${p.partner}</td>
                  <td style="font-weight:800;color:var(--gold);font-size:1rem;">${p.leads}</td>
                  <td style="color:var(--muted);">${p.target}</td>
                  <td>
                    <div class="pct-bar-wrap">
                      <div class="pct-bar-track">
                        <div class="pct-bar-fill" style="width:${barWidth}%;background:${barColor};"></div>
                      </div>
                      <div class="pct-label" style="color:${pctColor};">${p.pct}%</div>
                    </div>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>

        <!-- LEADS PER AE -->
        <div class="card">
          <div class="card-title"><span class="icon">👤</span> Leads per Account Executive</div>
          <div class="ae-list">
            ${aeSorted.map(([ae, count]) => {
              const isNonCRM = ae === 'NON-CRM';
              const width = Math.round((count / maxAE) * 100);
              return `<div class="ae-row">
                <div class="ae-name" title="${ae}">${isNonCRM ? '⚪ NON-CRM' : ae}</div>
                <div class="ae-track">
                  <div class="ae-fill ${isNonCRM?'non-crm':''}" style="width:${width}%;"></div>
                </div>
                <div class="ae-count" style="${isNonCRM?'color:#a78bfa;':''}">${count}</div>
              </div>`;
            }).join('')}
          </div>
        </div>

        <!-- NON-CRM ACCOUNTS -->
        <div class="card">
          <div class="card-title"><span class="icon">⚪</span> Non-CRM New Accounts <span style="color:var(--muted);font-size:0.82rem;font-weight:400;margin-left:8px;">${nonCRM.length} accounts</span></div>
          ${['Noura Ghoneim','Ismail Hamed'].map(ae => {
            const rows = nonCRM.filter(r => r.ncrm_ae === ae);
            if (!rows.length) return '';
            const avatarColor = ae === 'Noura Ghoneim' ? 'var(--teal2)' : '#a78bfa';
            return `
            <div style="margin-bottom:28px;">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
                <div style="width:32px;height:32px;border-radius:50%;background:${avatarColor}22;border:1px solid ${avatarColor}44;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:800;color:${avatarColor};">${ae.split(' ').map(w=>w[0]).join('')}</div>
                <span style="font-weight:700;font-size:0.92rem;">${ae}</span>
                <span style="color:var(--muted);font-size:0.78rem;">${rows.length} account${rows.length!==1?'s':''}</span>
              </div>
              <div style="overflow-x:auto;">
                <table class="ncrm-table">
                  <thead><tr><th>#</th><th>Account</th><th>Partner</th><th>Industry</th><th>Contact</th><th>Next Step</th></tr></thead>
                  <tbody>
                    ${rows.map((r,i) => `
                      <tr>
                        <td style="color:var(--muted);font-size:0.75rem;">${i+1}</td>
                        <td style="font-weight:700;">${r.account||'—'}</td>
                        <td><span class="partner-tag">${r.partner}</span></td>
                        <td><span class="industry-tag">${r.industry||'Other'}</span></td>
                        <td style="color:rgba(255,255,255,0.7);">${r.contact||'—'}</td>
                        <td style="color:rgba(255,255,255,0.6);font-size:0.78rem;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${r.nextstep}">${r.nextstep||'—'}</td>
                      </tr>`).join('')}
                  </tbody>
                </table>
              </div>
            </div>`;
          }).join('')}
        </div>

        <!-- INDUSTRY BREAKDOWN -->
        <div class="card">
          <div class="card-title"><span class="icon">🏭</span> Industry Breakdown</div>
          <div class="industry-grid">
            ${industrySorted.map(([ind, count]) => `
              <div class="industry-card">
                <div class="industry-icon">${INDUSTRY_ICONS[ind] || '📋'}</div>
                <div>
                  <div class="industry-count">${count}</div>
                  <div class="industry-name">${ind}</div>
                </div>
              </div>`).join('')}
          </div>
        </div>

        <!-- SOLUTION BREAKDOWN -->
        ${(()=>{
          const solSorted = Object.entries(solutionCounts).sort((a,b)=>b[1]-a[1]);
          const solTotal  = solSorted.reduce((s,[,v])=>s+v,0);
          const SOL_META  = {
            'ERP':   { color:'#00C8D4', icon:'🏢', label:'ERP / S4HANA' },
            'HR':    { color:'#a78bfa', icon:'👥', label:'SuccessFactors HR' },
            'CX':    { color:'#f59e0b', icon:'🎯', label:'SAP CX / Sales Cloud' },
            'Other': { color:'#94a3b8', icon:'📦', label:'Other Solutions' },
          };
          return `<div class="card">
            <div class="card-title"><span class="icon">💡</span> SAP Solutions Requested</div>
            <div style="display:flex;align-items:center;gap:32px;flex-wrap:wrap;">
              <div style="display:flex;gap:12px;flex-wrap:wrap;flex:1;">
                ${solSorted.map(([sol,count])=>{
                  const m = SOL_META[sol] || { color:'#94a3b8', icon:'📦', label:sol };
                  const pct = Math.round((count/solTotal)*100);
                  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px 28px;background:${m.color}0f;border:1px solid ${m.color}28;border-radius:12px;min-width:110px;text-align:center;">
                    <div style="font-size:1.6rem;">${m.icon}</div>
                    <div style="font-size:1.6rem;font-weight:900;color:${m.color};font-family:'Sora',sans-serif;line-height:1;">${count}</div>
                    <div style="font-size:0.75rem;font-weight:700;color:${m.color};">${m.label}</div>
                    <div style="font-size:0.7rem;color:var(--muted);">${pct}% of leads</div>
                  </div>`;
                }).join('')}
              </div>
              <div style="flex-shrink:0;min-width:200px;max-width:280px;flex:1;">
                ${solSorted.map(([sol,count],i)=>{
                  const m = SOL_META[sol] || { color:'#94a3b8', label:sol };
                  const w = Math.round((count/solSorted[0][1])*100);
                  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                    <div style="width:110px;font-size:0.8rem;color:rgba(255,255,255,0.8);font-weight:600;flex-shrink:0;">${m.label}</div>
                    <div style="flex:1;height:8px;background:rgba(255,255,255,0.07);border-radius:99px;overflow:hidden;">
                      <div style="height:8px;width:${w}%;background:${m.color};border-radius:99px;"></div>
                    </div>
                    <div style="width:24px;text-align:right;font-size:0.8rem;font-weight:700;color:${m.color};flex-shrink:0;">${count}</div>
                  </div>`;
                }).join('')}
              </div>
            </div>
          </div>`;
        })()}

      </div><!-- /tab-overview -->

      <!-- TAB: DASHBOARD -->
      <div id="tab-dashboard" class="tab-panel">

        <!-- ROW 1: industry donut + AE leaderboard -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">

          <div class="card" style="margin-bottom:0;">
            <div class="card-title"><span class="icon">🏭</span> Industry Mix</div>
            <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
              <div style="flex-shrink:0;width:160px;">${svgDonut(industrySlices,90,90,72)}</div>
              <div style="flex:1;min-width:140px;">
                ${industrySlices.map(s=>`
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;">
                    <div style="width:10px;height:10px;border-radius:2px;background:${s.c};flex-shrink:0;"></div>
                    <div style="font-size:0.78rem;color:rgba(255,255,255,0.8);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.k}</div>
                    <div style="font-size:0.78rem;font-weight:700;color:${s.c};">${s.v}</div>
                  </div>`).join('')}
              </div>
            </div>
          </div>

          <div class="card" style="margin-bottom:0;">
            <div class="card-title"><span class="icon">🏅</span> AE Leaderboard</div>
            ${aeDisplay.map(([ae,count],i)=>{
              const color = AE_COLORS[ae]||'#00C8D4';
              const medal = i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':'';
              return hBar(medal+ae, count, maxAEDisplay, color);
            }).join('')}
          </div>

        </div>

        <!-- ROW 2: partner leads + next steps -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">

          <div class="card" style="margin-bottom:0;">
            <div class="card-title"><span class="icon">🤝</span> Leads by Partner</div>
            ${partnerSorted.map(([p,v],i)=>hBar(p,v,maxPartner,CHART_COLORS[i%CHART_COLORS.length])).join('')}
          </div>

          <div class="card" style="margin-bottom:0;">
            <div class="card-title"><span class="icon">📋</span> Top Agreed Next Steps</div>
            ${nextStepSorted.length ? nextStepSorted.map(([s,v],i)=>hBar(s,v,maxNextStep,CHART_COLORS[i%CHART_COLORS.length])).join('') : '<div style="color:var(--muted);font-size:0.85rem;">No next steps recorded yet.</div>'}
          </div>

        </div>

        <!-- ROW 3: industry per AE heatmap -->
        <div class="card">
          <div class="card-title"><span class="icon">📊</span> Industry Coverage by AE</div>
          <div style="overflow-x:auto;">
            ${(()=>{
              const topIndustries = industrySorted.slice(0,6).map(([k])=>k);
              const aeList = aeDisplay.map(([ae])=>ae);
              const heat = {};
              active.forEach(r=>{
                const ae = normalizeAE(r['AE']);
                const disp = ae==='Salma Youssef'?'Ismail Hamed':ae==='NON-CRM'?null:ae;
                if(!disp) return;
                const ind = (r['Industry']||'Other').trim();
                if(!heat[disp]) heat[disp]={};
                heat[disp][ind]=(heat[disp][ind]||0)+1;
              });
              const maxCell = Math.max(1,...aeList.flatMap(ae=>topIndustries.map(ind=>heat[ae]?.[ind]||0)));
              return `<table style="border-collapse:collapse;font-size:0.78rem;width:100%;">
                <thead><tr>
                  <th style="text-align:left;padding:8px 12px;color:var(--muted);font-size:0.7rem;text-transform:uppercase;letter-spacing:.06em;min-width:120px;">AE</th>
                  ${topIndustries.map(ind=>`<th style="text-align:center;padding:8px 10px;color:var(--muted);font-size:0.7rem;text-transform:uppercase;letter-spacing:.04em;max-width:90px;">${ind.split('/')[0].trim()}</th>`).join('')}
                </tr></thead>
                <tbody>
                  ${aeList.map(ae=>`<tr>
                    <td style="padding:8px 12px;font-weight:700;white-space:nowrap;">${ae}</td>
                    ${topIndustries.map(ind=>{
                      const v=heat[ae]?.[ind]||0;
                      const opacity=v?Math.max(0.15,v/maxCell):0;
                      return `<td style="text-align:center;padding:8px 10px;">
                        ${v?`<div style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:rgba(0,200,212,${opacity});font-weight:700;color:#fff;">${v}</div>`:'<span style="color:rgba(255,255,255,0.15);">—</span>'}
                      </td>`;
                    }).join('')}
                  </tr>`).join('')}
                </tbody>
              </table>`;
            })()}
          </div>
        </div>

      </div><!-- /tab-dashboard -->

      <!-- TAB: AE ACCOUNTS -->
      <div id="tab-ae-summary" class="tab-panel">
        ${Object.keys(AE_COLORS).map(ae => {
          const color = AE_COLORS[ae];
          const hasCRM  = (allAERows[ae]||[]).length > 0;
          const hasNCRM = nonCRM.some(r=>r.ncrm_ae===ae);
          if (!hasCRM && !hasNCRM) return '';
          return `<div class="card" style="margin-bottom:20px;">
            <div class="card-title"><span class="icon">👤</span> ${ae}</div>
            ${renderAETab(ae, color)}
          </div>`;
        }).join('')}
      </div><!-- /tab-ae-summary -->
    `;

    document.getElementById('footer').style.display = 'block';
  })
  .catch(err => {
    document.getElementById('main-content').innerHTML = `<div class="loading">Failed to load data. Please try again.<br><small style="opacity:.5;">${err}</small></div>`;
  });

function switchTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}
</script>
</body>
</html>
